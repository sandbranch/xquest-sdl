name: Release

# Builds the full, playable game for each platform: the SDL2 engine plus
# the bundled XQuest game data.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Determine tag and check it against CMakeLists.txt
        id: tag
        shell: bash
        run: |
          . scripts/version.sh
          project="$(xquest_version)"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            # One number for everything: a tag that disagrees with
            # project(xquest VERSION ...) is a bump someone forgot.
            XQUEST_VERSION="$tag" xquest_resolve_version "$project" >/dev/null
            version="${tag#v}"
          else
            tag="dev-${{ github.run_number }}"
            version="$project"
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "XQuest $TAG" \
            --generate-notes \
            --prerelease="$([ "${{ github.ref_type }}" = "tag" ] && echo false || echo true)" \
            || echo "Release $TAG already exists, continuing"

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      # The plain number, never the tag: on a manual run the "tag" is
      # dev-<n>, which is not a version any artifact should carry.
      XQUEST_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev cmake dpkg-dev
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/build-appimage.sh
      - name: Build .deb
        run: bash scripts/build-deb.sh
      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            "xquest-${XQUEST_VERSION}-x86_64.AppImage" \
            build-deb/*.deb

  macos:
    needs: create-release
    runs-on: macos-latest
    env:
      # The plain number, never the tag: on a manual run the "tag" is
      # dev-<n>, which is not a version any artifact should carry.
      XQUEST_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install sdl2
      - name: Build .dmg
        run: bash scripts/build-macos.sh
      - name: Upload artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "XQuest-${XQUEST_VERSION}-macos.dmg"

  windows:
    needs: create-release
    runs-on: windows-latest
    env:
      # The plain number, never the tag: on a manual run the "tag" is
      # dev-<n>, which is not a version any artifact should carry.
      XQUEST_VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL2 (vcpkg)
        run: vcpkg install sdl2:x64-windows
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build installer
        shell: pwsh
        run: pwsh -File scripts/build-windows.ps1
      - name: Upload artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "XQuest-${XQUEST_VERSION}-Setup.exe"
